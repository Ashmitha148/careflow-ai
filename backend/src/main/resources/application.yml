server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: careflow-backend
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

careflow:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://careflow-ai-beta.vercel.app}
  gemini:
    api-key: ${GEMINI_API_KEY:placeholder-gemini-api-key}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo-cloud}
    api-key: ${CLOUDINARY_API_KEY:demo-key}
    api-secret: ${CLOUDINARY_API_SECRET:demo-secret}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    backoff-base-ms: ${OUTBOX_BACKOFF_BASE_MS:2000}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

# Phase 4 — Resilience4j circuit breaker, retry, timeout, rate limiter for
# external calls (Gemini, Cloudinary) and auth/AI endpoints.
resilience4j:
  circuitbreaker:
    instances:
      gemini:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      cloudinary:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      gemini:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      cloudinary:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      auth:
        limit-for-period: ${RATE_LIMIT_AUTH:10}
        limit-refresh-period: 1m
        timeout: 1s
      ai:
        limit-for-period: ${RATE_LIMIT_AI:30}
        limit-refresh-period: 1m
        timeout: 1s
  timelimiter:
    instances:
      gemini:
        timeout-duration: 30s
      cloudinary:
        timeout-duration: 20s

logging:
  level:
    org.hibernate.SQL_SLOW: WARN
    com.careflow.ai.resilience: DEBUG

---
# Development Profile - H2 In-Memory Database
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:careflow_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: CareFlowHikariPool-Dev
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200
        generate_statistics: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
# Production Profile - PostgreSQL Database
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: CareFlowHikariPool-Prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration