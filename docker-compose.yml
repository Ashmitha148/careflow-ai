version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: careflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careflow_db
      POSTGRES_USER: careflow_user
      POSTGRES_PASSWORD: careflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow_user -d careflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/careflow_db
      - SPRING_DATASOURCE_USERNAME=careflow_user
      - SPRING_DATASOURCE_PASSWORD=careflow_password
      # Dev/demo compose file: JWT_SECRET must still never be a real secret.
      # Generate your own with: openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:-change-me-before-any-real-deployment-0123456789abcdef}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo-key}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo-cloud}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-demo-key}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-demo-secret}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careflow-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Observability stack (local dev only — not required in production)
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: careflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: careflow-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
