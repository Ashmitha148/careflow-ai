version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careflow_db
      POSTGRES_USER: careflow_user
      POSTGRES_PASSWORD: careflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow_user -d careflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/careflow_db
      - SPRING_DATASOURCE_USERNAME=careflow_user
      - SPRING_DATASOURCE_PASSWORD=careflow_password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-demo-key}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo-cloud}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-demo-key}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-demo-secret}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careflow-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
